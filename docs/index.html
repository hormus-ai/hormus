const docs={
'Introduction':`<div class="eyebrow">GETTING STARTED</div><h1>HORMUS</h1><p>HORMUS is a research workspace for tokens on Robinhood Chain. It pulls live pools from GeckoTerminal and launches from Pons, puts research agents to work on that data, and gives every user a wallet to swap tokens directly through Uniswap v3 and an on-chain USDG vault to fund agents.</p><div class="doccallout">Live today on <b>Robinhood Chain (4663)</b>: market data, research agents, live swaps, Privy wallets and the verified USDG vault at <a href="${BS}/address/${VAULT}?tab=contract" target="_blank" rel="noopener noreferrer"><code>0xC1a6…D32e</code></a>.</div><h2>Built around three ideas</h2><h3>Evidence first</h3><p>Every number in a report comes from a named source and links back to it. When a source does not report a value, HORMUS leaves it blank. It never fills a gap with an estimate.</p><h3>Your keys, your funds</h3><p>Wallets are created for you at sign-in and stay under your control. The vault holds USDG in your name; you deposit, reserve and withdraw with your own signature. Agents never hold keys.</p><h3>You set the limits</h3><p>Each agent gets its own budget, max per order and daily limit that you choose. Every swap is simulated first and then signed in your own wallet.</p><h2>Where to go next</h2><ul><li><a href="#quick-start">Quick start</a> takes you from sign-in to your first report.</li><li><a href="#your-hormus-wallet">Your HORMUS wallet</a> and <a href="#usdg-vault">USDG vault</a> explain funding.</li><li><a href="#contract-reference">Contract reference</a> lists every address.</li></ul>`,

'Quick start':`<div class="eyebrow">GETTING STARTED</div><h1>Quick start</h1><p>From sign-in to your first saved research report.</p><ol><li><b>Sign in with Google</b> at <a href="https://app.hormus.io" target="_blank" rel="noopener noreferrer">app.hormus.io</a>. Your HORMUS wallet is created on first sign-in.</li><li><b>Open Markets.</b> Browse trending, top and new tokens, or search by name, symbol or contract.</li><li><b>Create an agent.</b> Go to Agents → New agent. Give it a name and, optionally, your own instructions.</li><li><b>Run research.</b> Pick how many assets to scan (5 to 50), the sources and the Pons stage, then start. The report opens when the run finishes.</li><li><b>Trade for real (optional).</b> On any token page, use the Swap tab to buy with USDG from your wallet.</li><li><b>Fund an agent (optional).</b> Send USDG and a little ETH to your wallet, deposit into the vault on Agent funding, then reserve a budget for the agent.</li></ol><div class="doccallout">Swaps and vault actions are real transactions. Each one asks for your signature first.</div>`,

'What is live':`<div class="eyebrow">GETTING STARTED</div><h1>What is live</h1><table><thead><tr><th>Capability</th><th>Status</th></tr></thead><tbody><tr><td>Google sign-in</td><td>Live (Privy)</td></tr><tr><td>HORMUS wallet on Robinhood Chain</td><td>Live, created at first sign-in</td></tr><tr><td>Markets and token pages</td><td>Live (GeckoTerminal, Crius / Pons)</td></tr><tr><td>Research agents and schedules</td><td>Live</td></tr><tr><td>Research terminal</td><td>Live</td></tr><tr><td>Live swaps from your wallet (Uniswap v3)</td><td>Live, on every token page</td></tr><tr><td>Portfolio with real wallet balances, vault and swap history</td><td>Live</td></tr><tr><td>Watchlist alerts</td><td>Live</td></tr><tr><td>USDG vault: deposit, reserve, release, withdraw</td><td>Live, contract verified on Blockscout</td></tr><tr><td>Agents trading their budget on their own</td><td>Available on the agent vault (v2) once switched on; opt-in per agent</td></tr><tr><td>Swaps for Uniswap v4 and Pons bonding-curve tokens</td><td>Live</td></tr></tbody></table>`,

'Markets':`<div class="eyebrow">PRODUCT</div><h1>Markets</h1><p>One table for every active token on Robinhood Chain, merged from two sources and de-duplicated by contract address.</p><h2>Views</h2><ul><li><b>Market intelligence:</b> trending pools.</li><li><b>Top activity:</b> pools ranked by activity.</li><li><b>New assets:</b> the newest pools and Pons launches.</li><li><b>Search:</b> name, symbol or full contract address.</li><li><b>Source filter:</b> all, GeckoTerminal only, or Pons only.</li></ul><h2>What each row shows</h2><p>Price, 24h change, 24h volume, liquidity, the source and the launch stage. Benchmark pairs (USDG, WETH, USDC and other stable or wrapped assets) are kept out so the list shows tokens, not plumbing.</p><p>Open any row to go to its <a href="#token-pages">token page</a>. Data refreshes on every visit and is cached for 60 seconds.</p>`,

'Token pages':`<div class="eyebrow">PRODUCT</div><h1>Token pages</h1><p>Everything HORMUS knows about one contract, on one page.</p><ul><li><b>Overview:</b> price, 24h change, volume, liquidity, market cap and FDV.</li><li><b>Chart:</b> candles at 5m, 15m, 1h, 4h and 1d.</li><li><b>Transactions:</b> the latest 100 trades with side, price, value, wallet and transaction link. Filter by buy or sell.</li><li><b>Holders:</b> up to 100 top holders with share and value, infrastructure wallets excluded.</li><li><b>Bonding curve:</b> for Pons tokens, progress toward graduation, amount raised, target, curve contract and graduation pool.</li><li><b>Intelligence:</b> signals derived from the data above, each with the evidence behind it.</li></ul><p>Every page links to Blockscout and, when a pool exists, to GeckoTerminal.</p><h2>Trade panel</h2><p>The panel next to the chart turns the page into a desk for that token:</p><ul><li><b>Swap:</b> buy or sell for real from your wallet. See <a href="#live-swaps">Live swaps</a>.</li><li><b>Agent:</b> send the token to a research agent. It receives this token's market, lifecycle, recent trades and holders, and the report lands in Activity.</li><li><b>Watchlist:</b> one click to track it and set alerts.</li></ul>`,

'Live swaps':`<div class="eyebrow">PRODUCT</div><h1>Live swaps</h1><p>Buy or sell tokens straight from your HORMUS wallet, on the token's page. HORMUS picks the venue for you:</p><table><thead><tr><th>Token</th><th>Venue</th><th>You pay with</th></tr></thead><tbody><tr><td>Has a Uniswap v3 pool with USDG or WETH</td><td>Uniswap v3 (SwapRouter02)</td><td>USDG</td></tr><tr><td>Still on its Pons launch curve</td><td>The token's own Pons V2 bonding curve</td><td>ETH</td></tr><tr><td>Graduated Pons tokens and other v4 tokens</td><td>Uniswap v4 (Universal Router, Robinhood build)</td><td>ETH (wrapped to WETH automatically) or USDG</td></tr></tbody></table><p>Pools and curves are found on-chain: v4 pools from the PoolManager's <code>Initialize</code> events, and a Pons curve from the address the launch supply was minted to, confirmed by <code>curve.token()</code>.</p><h2>How a swap works</h2><ol><li>Enter an amount in USDG to buy, or in tokens to sell (Max fills your balance).</li><li>HORMUS quotes the trade: QuoterV2 for v3 (direct USDG or through WETH, all fee tiers), V4Quoter for v4, and a simulated buy on the curve for Pons. Curve sells show an estimate first.</li><li>You see the route, the estimated amount, the minimum you will receive at your slippage (0.5%, 1% or 3%) and the price versus market.</li><li><b>Every swap is simulated against the chain before you sign.</b> If the simulation fails, nothing is sent. Your wallet then asks for the approvals it needs (once per token) and the swap. Swaps expire if not mined within 10 minutes. When a v4 sell pays out WETH, HORMUS unwraps it to ETH as a last step.</li><li>The swap is recorded in Activity. HORMUS reads the receipt on-chain and only marks it confirmed when the chain does.</li></ol><div class="doccallout">Swaps go through Uniswap's own SwapRouter02. HORMUS never takes custody of your tokens, and you sign every transaction yourself.</div><h2>Pons launch curve</h2><p>Early buyers on a fresh Pons launch may pay a temporary snipe tax; the trade panel shows the current rate before you buy. Curve fees are included in the quote.</p><h2>Costs</h2><p>The pool fee of the route (shown in the route, e.g. 0.01% and 0.3%) and a Robinhood Chain network fee in ETH. HORMUS adds no fee.</p>`,
'Skills':`<div class="eyebrow">PRODUCT</div><h1>Skills</h1><p>A skill is a set of instructions that teaches an agent one job: checking rug risk, tracking whales, watching Pons graduations, scanning momentum. Anyone can share a skill and anyone can use it, for free.</p><h2>Use a skill</h2><ul><li><b>On an agent:</b> Agents → <b>Skills</b> on the agent's card → <b>Add</b>. The agent applies its skills (up to 5) every time it researches.</li><li><b>In the Terminal:</b> type <code>/name</code>, for example <code>/rug-check 0x…</code> or <code>/momentum what is moving today?</code>. A contract address in the message gives the skill that token's full data.</li><li><b>Anywhere else:</b> open a skill and press <b>Download SKILL.md</b>. The file uses the open skill format, so it works in other agents too.</li></ul><h2>Share a skill</h2><ul><li><b>Create skill:</b> name, command, short description, category, the data it needs and the instructions.</li><li><b>Import from GitHub:</b> paste a public link to a folder with a <code>SKILL.md</code> (or the file). Only the text is imported; code in the repo is never run.</li><li>Choose <b>Everyone</b> or <b>Only me</b>.</li></ul><h2>Built in</h2><table><tbody><tr><th><code>/rug-check</code></th><td>Scores rug-pull risk from holders, liquidity, creator and trade flow.</td></tr><tr><th><code>/whale-tracker</code></th><td>Finds unusually large trades and the wallets behind them.</td></tr><tr><th><code>/pons-graduation</code></th><td>Ranks Pons launches by how close they are to graduating.</td></tr><tr><th><code>/momentum</code></th><td>Finds moves backed by volume and liquidity.</td></tr></tbody></table><h2>Safety</h2><p>Skills only shape research. They cannot change HORMUS rules: no invented data, numbers cited from the supplied data only, and any trade idea still passes your limits, the token checks and your wallet confirmation. Every skill's instructions are visible before you add it. Report anything misleading; a skill reported 5 times is hidden.</p>`,
'Research agents':`<div class="eyebrow">PRODUCT</div><h1>Research agents</h1><p>An agent is a named research profile with its own instructions. You run it on demand or on a schedule; each run produces a report saved to your account.</p><h2>Roles</h2><p>A role sets the agent's focus. Every agent uses the same research pipeline, shaped by its instructions.</p><table><tbody><tr><th>Research</th><td>Finds and explains notable tokens.</td></tr><tr><th>Quant</th><td>Monitors market activity and changes.</td></tr><tr><th>Portfolio</th><td>Focuses on risk and exposure.</td></tr><tr><th>Execution</th><td>Looks at entry conditions, liquidity depth and costs.</td></tr><tr><th>Custom</th><td>Your instructions, research defaults.</td></tr></tbody></table><h2>Running a task</h2><ul><li><b>Assets:</b> 5, 10, 20, 30 or 50.</li><li><b>Sources:</b> all, Robinhood markets (GeckoTerminal) or Pons launchpad.</li><li><b>Pons stage:</b> new, bonding, near graduation, graduated, or all.</li><li><b>Instruction:</b> what you want answered. Your agent's own instructions are added automatically.</li></ul><h2>What a report contains</h2><p>A summary, an asset table built directly from the fetched data, risk observations, signals to monitor, scenarios, source links and a timeline of the run. The asset table always shows the number of assets you asked for when that many exist; the model adds commentary but cannot remove rows.</p><h2>Trade ideas</h2><p>Switch on <b>Can suggest trades</b> in an agent's profile (on by default for Execution agents). The agent may then add up to three trade ideas to a report: token, buy or sell, amount, slippage, the reason and what would make it wrong.</p><ul><li>Only tokens the agent actually saw in that run's data are accepted. Invented addresses are dropped.</li><li>Amounts are capped at the agent's <b>max per order</b> from its budget (or your trading limits when it has none).</li><li>Before you sign, HORMUS checks the idea is still open, not expired and within the agent's <b>daily limit</b>.</li><li>Press <b>Review &amp; execute</b>: the token page opens with the swap filled in. You confirm in your wallet. Ideas expire after 24 hours.</li></ul><p>Open ideas appear in the report, on Overview and on the Trade page.</p><h2>Statuses</h2><p><b>Draft</b> agents run normally. <b>Paused</b> agents and their schedules stop until you set them back to draft.</p>`,

'Schedules':`<div class="eyebrow">PRODUCT</div><h1>Schedules</h1><p>Put any agent task on repeat. Open an agent → Schedules.</p><ul><li><b>Intervals:</b> every 15 minutes, 1 hour, 6 hours, 12 hours, 24 hours or 7 days.</li><li><b>Pause or delete</b> a schedule at any time without touching past reports.</li><li>Each scheduled run appears in Activity like a manual one and raises an alert when it completes or fails.</li></ul><p>The worker checks for due work every few seconds. A run that stalls for more than 10 minutes is put back in the queue automatically.</p>`,

'Research terminal':`<div class="eyebrow">PRODUCT</div><h1>Research terminal</h1><p>Ask a question in plain language and get an answer grounded in the current market snapshot of Robinhood Chain.</p><p>Each answer comes with findings, risks, limitations and the sources it used. The terminal remembers the last 12 messages of the conversation so you can follow up.</p><h3>Questions that work well</h3><ul><li>"Which Pons launches gained the most volume in the last 24 hours?"</li><li>"Compare liquidity and buy/sell balance for CASHCAT and PONS."</li><li>"What would make this token's momentum unreliable?"</li></ul><p>Answers are research. HORMUS does not give buy or sell instructions.</p>`,

'Watchlist & alerts':`<div class="eyebrow">PRODUCT</div><h1>Watchlist & alerts</h1><p>Save any token from Markets and set an upper and a lower 24h move threshold, for example +15% and −10%.</p><p>HORMUS checks your watchlist every minute. When a token crosses a threshold you get an alert in Activity, at most once per hour per direction, so a volatile token does not flood your feed.</p><p>Research runs also raise alerts when they finish or fail.</p>`,

'Activity & analytics':`<div class="eyebrow">PRODUCT</div><h1>Activity & analytics</h1><h2>Activity</h2><p>One feed for everything that happened on your account: research runs, alerts and live swaps. Open any run to see its full report. Mark alerts as read when you have seen them.</p><h2>Portfolio</h2><p>Your real holdings, read from Robinhood Chain: ETH, USDG and every token you swapped in HORMUS or keep on your watchlist, priced in USD from GeckoTerminal. Below that: your vault balance, the amount reserved for agents, and your live swap history.</p><h2>Agent analytics</h2><p>Total, completed, active and failed runs, average run time and live swap results. Search and filter the run log by agent, task or status.</p><p>Your history is stored on the server and follows your account to any device.</p>`,

'Your HORMUS wallet':`<div class="eyebrow">WALLET & VAULT</div><h1>Your HORMUS wallet</h1><p>The first time you sign in, HORMUS creates a wallet for you on Robinhood Chain through Privy. You don't install anything or write down a seed phrase to get started.</p><ul><li><b>You control it.</b> Every transaction opens a confirmation in Privy and only goes through when you approve it.</li><li><b>HORMUS cannot spend from it.</b> The backend never holds your keys.</li><li><b>Prefer MetaMask?</b> On Agent funding, choose "Use browser wallet instead".</li></ul><h2>Funding the wallet</h2><p>Copy your address from Agent funding and send it:</p><ul><li><b>USDG</b> on Robinhood Chain: the amount you want to deposit.</li><li><b>A little ETH</b> on Robinhood Chain to pay network fees. Fees on Robinhood Chain are a fraction of a cent.</li></ul><p>Balances for ETH, USDG in your wallet, USDG in the vault and the amount free to withdraw are shown on the same page.</p>`,

'USDG vault':`<div class="eyebrow">WALLET & VAULT</div><h1>USDG vault</h1><p>The HormusAgentVault holds USDG for each user separately and lets you set part of it aside for your agents. Source code is verified on Blockscout.</p><div class="doccallout">Vault <a href="${BS}/address/${VAULT}?tab=contract" target="_blank" rel="noopener noreferrer"><code>${VAULT}</code></a> · USDG <code>${USDG}</code> · Robinhood Chain 4663</div><h2>What you can do</h2><table><tbody><tr><th>Deposit</th><td>Two confirmations: allow the vault to take the amount, then deposit. Your vault balance increases by exactly that amount.</td></tr><tr><th>Reserve</th><td>Set part of your vault balance aside for one agent, with a max per order and a max per day.</td></tr><tr><th>Release</th><td>Return an agent's reserve to your free balance.</td></tr><tr><th>Withdraw</th><td>Send any free (unreserved) USDG back to your wallet.</td></tr></tbody></table><h2>Guarantees in the contract</h2><ul><li>Balances are tracked per wallet. No one can withdraw or release another user's funds.</li><li>You can always withdraw free funds and release reserves, even when deposits are paused.</li><li>The operator can pause new deposits and reserves. There is no function that lets the operator move user funds.</li><li>Deposits must arrive in full; tokens that skim a fee on transfer are rejected.</li><li>Deposit and withdraw are protected against re-entrancy.</li><li>No agent, backend or operator spending function exists.</li></ul>`,

'Agent budgets':`<div class="eyebrow">WALLET & VAULT</div><h1>Agent budgets</h1><p>Agents don't get their own wallets or keys. Instead, you give an agent a budget.</p><ol><li>On Agent funding, pick an agent and set a <b>budget</b>, a <b>max per order</b> and a <b>max per day</b>. Save.</li><li>Press <b>Reserve</b>. Your wallet signs one transaction and the vault marks that amount for the agent.</li><li>Reserved USDG stays in the vault under your wallet. It can't be withdrawn while reserved, and the agent can't move it.</li><li>Press <b>Release</b> at any time to make it free again.</li></ol><p>The table shows both the budget you saved and the amount actually reserved on-chain, so you always see the real state. Each agent is identified in the vault by the keccak-256 hash of its HORMUS ID.</p><h2>Letting an agent trade on its own</h2><p>On the agent vault (v2), each budget row has <b>Let agent trade (7 days)</b>. You sign one transaction and the agent may then buy and sell with that budget whenever its research produces a trade idea.</p><ul><li>Only within the budget, the <b>max per order</b> and the <b>max per day</b>, all enforced by the contract.</li><li>Only tokens HORMUS has allowlisted, only through Uniswap v3, only paired with USDG or WETH.</li><li>Tokens it buys stay in the vault under your wallet; sales go back into its budget. Nothing can be sent anywhere else.</li><li>Permission lasts at most 30 days and you can turn it off with one click. You get an alert for every automatic trade.</li><li><b>Tokens your agents bought</b> lists what they hold, with <b>Move to wallet</b>.</li></ul><div class="doccallout">Automatic trading is opt-in per agent. Without it, agents only suggest trades and you approve each one.</div>`,

'Contract reference':`<div class="eyebrow">WALLET & VAULT</div><h1>Contract reference</h1><table><tbody><tr><th>Network</th><td>Robinhood Chain mainnet · chain ID <code>4663</code></td></tr><tr><th>HormusAgentVault</th><td><a href="${BS}/address/${VAULT}?tab=contract" target="_blank" rel="noopener noreferrer"><code>${VAULT}</code></a></td></tr><tr><th>USDG token</th><td><a href="${BS}/token/${USDG}" target="_blank" rel="noopener noreferrer"><code>${USDG}</code></a> · 6 decimals</td></tr><tr><th>Compiler</th><td>Solidity 0.8.24, optimizer on (200 runs)</td></tr><tr><th>Verification</th><td>Full match on Blockscout</td></tr><tr><th>Explorer</th><td><a href="${BS}" target="_blank" rel="noopener noreferrer">robinhoodchain.blockscout.com</a></td></tr></tbody></table><h2>Uniswap v3 (live swaps)</h2><table><tbody><tr><th>SwapRouter02</th><td><a href="${BS}/address/0xcaf681a66d020601342297493863e78c959e5cb2?tab=contract" target="_blank" rel="noopener noreferrer"><code>0xcaf681a66d020601342297493863e78c959e5cb2</code></a></td></tr><tr><th>QuoterV2</th><td><a href="${BS}/address/0x33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7?tab=contract" target="_blank" rel="noopener noreferrer"><code>0x33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7</code></a></td></tr><tr><th>UniswapV3Factory</th><td><code>0x1f7d7550B1b028f7571E69A784071F0205FD2EfA</code></td></tr><tr><th>WETH</th><td><code>0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73</code></td></tr></tbody></table><p>All four are verified on Blockscout; the router and quoter were deployed against this factory and WETH.</p><h2>Uniswap v4</h2><table><tbody><tr><th>Universal Router (Robinhood build)</th><td><code>0x8876789976decbfcbbbe364623c63652db8c0904</code></td></tr><tr><th>V4Quoter</th><td><code>0x8dc178efb8111bb0973dd9d722ebeff267c98f94</code></td></tr><tr><th>PoolManager</th><td><code>0x8366a39cc670b4001a1121b8f6a443a643e40951</code></td></tr><tr><th>StateView</th><td><code>0xf3334192d15450cdd385c8b70e03f9a6bd9e673b</code></td></tr><tr><th>Permit2</th><td><code>0x000000000022D473030F116dDEE9F6B43aC78BA3</code></td></tr></tbody></table><p>The Robinhood build of the Universal Router adds a <code>minHopPriceX36</code> field to v4 swap parameters; HORMUS sets it to 0 and protects you with <code>amountOutMinimum</code> instead.</p><h2>Vault functions</h2><table><thead><tr><th>Function</th><th>Who</th><th>Effect</th></tr></thead><tbody><tr><td><code>deposit(amount)</code></td><td>Any user</td><td>Pulls USDG from the caller into their vault balance.</td></tr><tr><td><code>withdraw(amount, recipient)</code></td><td>Any user</td><td>Sends free USDG from the caller's balance.</td></tr><tr><td><code>allocate(agentId, amount, maxOrder, dailyLimit)</code></td><td>Any user</td><td>Reserves part of the caller's balance for an agent.</td></tr><tr><td><code>deallocate(agentId)</code></td><td>Any user</td><td>Releases the caller's reserve for an agent.</td></tr><tr><td><code>deposited</code>, <code>allocatedTotal</code>, <code>allocations</code>, <code>availableToAllocate</code>, <code>vaultBalance</code></td><td>Read</td><td>Balances and reserves.</td></tr><tr><td><code>setDepositsPaused(bool)</code></td><td>Owner</td><td>Pauses or resumes deposits and new reserves.</td></tr><tr><td><code>transferOwnership(address)</code></td><td>Owner</td><td>Moves the pause permission.</td></tr></tbody></table>`,

'System overview':`<div class="eyebrow">ARCHITECTURE</div><h1>System overview</h1><ul><li><b>Web app</b> (hormus.io, app.hormus.io): static site on Netlify.</li><li><b>API and worker</b>: Node.js on Railway. Serves account data, runs research, schedules and alerts, and relays chain RPC.</li><li><b>Database</b>: PostgreSQL on Railway. Users, agents, runs, schedules, alerts, swap history and funding plans.</li><li><b>Authentication and wallets</b>: Privy (Google sign-in, embedded wallets).</li><li><b>Market data</b>: GeckoTerminal and Crius (Pons), optionally Bitquery.</li><li><b>AI model</b>: an OpenAI-compatible provider called from the server only.</li><li><b>Chain</b>: Robinhood Chain, with the HormusAgentVault contract.</li></ul><p>The browser never sees API keys or database credentials. Chain reads and signed transactions from the app go through the HORMUS RPC relay so wallets keep working on networks that block the public RPC.</p>`,

'Data sources':`<div class="eyebrow">ARCHITECTURE</div><h1>Data sources</h1><table><thead><tr><th>Source</th><th>Used for</th></tr></thead><tbody><tr><td>GeckoTerminal</td><td>Pools, prices, volume, liquidity, market cap and FDV</td></tr><tr><td>Crius (Pons)</td><td>Launches, bonding-curve progress, candles, trades and holders</td></tr><tr><td>Bitquery (optional)</td><td>Extra candles and trades when configured</td></tr><tr><td>Blockscout</td><td>Contract, wallet and transaction links</td></tr><tr><td>Robinhood Chain RPC</td><td>Wallet balances and vault state</td></tr></tbody></table><p>Each record keeps its source and fetch time. Missing fields stay empty; HORMUS does not interpolate or estimate them.</p>`,

'Research pipeline':`<div class="eyebrow">ARCHITECTURE</div><h1>Research pipeline</h1><ol><li>Your run is queued with its scope: asset count, sources and Pons stage.</li><li>The worker fetches pools and launches, drops benchmark pairs and merges duplicates by contract address.</li><li>The model receives only that data, plus your task and your agent's instructions, and returns structured findings.</li><li>HORMUS builds the asset table from the fetched data and attaches the model's commentary to matching rows.</li><li>The report, source list and run timeline are saved; an alert is raised.</li></ol><p>A failed run keeps its error and timeline so you can see what went wrong. Runs that stall are re-queued after 10 minutes.</p>`,

'Security model':`<div class="eyebrow">ARCHITECTURE</div><h1>Security model</h1><ul><li><b>Authentication:</b> every API call carries a Privy access token, verified on the server.</li><li><b>Isolation:</b> every query is scoped to your account. Knowing another record's ID does not grant access.</li><li><b>Keys:</b> wallet keys are secured by Privy and only unlocked in your signed-in session when you approve a transaction. HORMUS servers hold no wallet keys.</li><li><b>Secrets:</b> API keys and database credentials live in server configuration only.</li><li><b>Limits:</b> agent budgets and trade-idea limits are enforced on the server.</li><li><b>Live swaps:</b> signed in your wallet, routed only through Uniswap's verified SwapRouter02, with a minimum-output guard and a 10-minute deadline. Swap status comes from the on-chain receipt.</li><li><b>Contract:</b> user-owned balances, no admin withdrawal path, verified source.</li><li><b>RPC relay:</b> forwards standard read calls and already-signed transactions only, with per-IP rate limits.</li></ul>`,

'Limits & fees':`<div class="eyebrow">REFERENCE</div><h1>Limits & fees</h1><table><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Max per trade (agent ideas)</td><td>You choose in Settings (default 50 USDG)</td></tr><tr><td>Daily spend</td><td>You choose in Settings (default 100 USDG)</td></tr><tr><td>Agent budgets</td><td>You choose per agent: budget, max per order, max per day</td></tr><tr><td>Max slippage on proposals</td><td>Up to 200 bps (default 200)</td></tr><tr><td>Approval after risk checks</td><td>Manual by default</td></tr><tr><td>Research run size</td><td>5 to 50 assets</td></tr><tr><td>Schedule interval</td><td>15 minutes to 7 days</td></tr><tr><td>Watchlist alert frequency</td><td>Max once per hour per direction</td></tr><tr><td>Live swap slippage</td><td>0.5%, 1% (default) or 3%</td></tr><tr><td>Live swap fees</td><td>Uniswap pool fee + network fee. HORMUS adds none.</td></tr><tr><td>Vault fees</td><td>None charged by HORMUS. You pay Robinhood Chain network fees in ETH.</td></tr></tbody></table>`,

'Glossary':`<div class="eyebrow">REFERENCE</div><h1>Glossary</h1><h3>Agent</h3><p>A research profile with a role and instructions that runs tasks and produces reports.</p><h3>Budget</h3><p>An amount of USDG reserved in the vault for one agent.</p><h3>Bonding curve</h3><p>The Pons launch phase where price follows a curve until the token graduates to a pool.</p><h3>Reserve / release</h3><p>Marking vault funds for an agent, and making them free again.</p><h3>Robinhood Chain</h3><p>The network HORMUS runs on, chain ID 4663.</p><h3>USDG</h3><p>The stablecoin HORMUS uses for balances, budgets and swaps.</p>`,

'FAQ':`<div class="eyebrow">REFERENCE</div><h1>FAQ</h1><h3>Is trading in HORMUS real?</h3><p>Yes. Swaps on token pages are real trades through Uniswap or the Pons curve, signed in your own wallet. Agents cannot trade with your funds.</p><h3>Can HORMUS or an agent take my funds?</h3><p>No. Agents have no keys. If you let an agent trade, the vault only lets it swap your reserved budget into allowlisted tokens and back, within your limits, and everything stays in the vault under your wallet. Only you can withdraw.</p><h3>Can I always get my USDG back?</h3><p>Yes. Release any reserves, then withdraw. Withdrawals work even when deposits are paused.</p><h3>Why do I need ETH?</h3><p>Robinhood Chain charges network fees in ETH. A very small amount covers many transactions.</p><h3>Where does the data come from?</h3><p>GeckoTerminal, Crius (Pons) and Blockscout. See <a href="#data-sources">Data sources</a>.</p><h3>Is a report financial advice?</h3><p>No. Reports describe what the data shows and what could go wrong. They never tell you to buy or sell.</p>`,

'Roadmap':`<div class="eyebrow">REFERENCE</div><h1>Roadmap</h1><h2>Shipped</h2><ul><li>Google sign-in and a HORMUS wallet for every user.</li><li>Markets and token pages for GeckoTerminal pools and Pons launches.</li><li>Research agents, schedules, research terminal and saved reports.</li><li>Watchlist alerts.</li><li>Live swaps through Uniswap v3, Uniswap v4 and Pons launch curves from every token page.</li><li>Agent trade ideas you approve with one click.</li><li>Live portfolio: wallet holdings priced in USD, vault balance and swap history.</li><li>Verified USDG vault with deposits, agent budgets and withdrawals.</li></ul><h2>Next</h2><ul><li>Independent audit of the agent vault before opening automatic trading to everyone.</li></ul><p>Items under Next have no fixed dates.</p>`,

'Troubleshooting':`<div class="eyebrow">SUPPORT</div><h1>Troubleshooting</h1><h3>Sign-in doesn't open</h3><p>Refresh the page and allow pop-ups for app.hormus.io. Make sure you are on <b>app.hormus.io</b>.</p><h3>My wallet address doesn't appear</h3><p>Open Agent funding and wait a few seconds. If it still says no wallet, press <b>Create my wallet</b>.</p><h3>Deposit button is greyed out</h3><p>Check that the wallet has USDG and some ETH for fees, and that deposits are not paused.</p><h3>"Not enough ETH to pay the network fee"</h3><p>Send a small amount of ETH on Robinhood Chain to your wallet address.</p><h3>Can't withdraw the full amount</h3><p>Part of your balance is reserved for agents. Release the budget first.</p><h3>A research run failed</h3><p>Open it from Activity to see the reason, then run it again. Market providers occasionally time out.</p><h3>Market data is missing</h3><p>The source didn't report it. Try Refresh, or switch the source filter.</p>`
};
function docSlug(v){return v.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}

function renderDocs(){
 const side=document.getElementById('docside'),content=document.getElementById('doccontent'),panel=document.getElementById('browserPanel');
 const all=docGroups.flatMap(g=>g[1]);
 let slug=decodeURIComponent((location.hash||'').replace(/^#/,''))||decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,''));
 let selected=Object.keys(docs).find(k=>docSlug(k)===slug)||docCurrent||'Introduction';
 docCurrent=selected;
 side.innerHTML=docGroups.map(g=>`<div class="docgroup"><small>${g[0]}</small>${g[1].map(n=>`<button class="doclink ${n===selected?'active':''}" data-doc="${esc(n)}">${esc(n)}</button>`).join('')}</div>`).join('');
 panel.innerHTML=docGroups.map(g=>`<div class="browserGroup"><small>${g[0]}</small>${g[1].map(n=>`<button class="browserLink ${n===selected?'active':''}" data-doc="${esc(n)}">${esc(n)}</button>`).join('')}</div>`).join('');
 document.getElementById('browserCurrent').textContent=selected;
 const idx=all.indexOf(selected),prev=all[idx-1],next=all[idx+1];
 content.innerHTML=(docs[selected]||docs['Introduction'])+`<nav class="docPager" aria-label="Article navigation"><a class="prev ${prev?'':'disabled'}" href="${prev?'#'+docSlug(prev):'#'}"><small>← Previous${prev?'':' article'}</small><strong>${prev?esc(prev):'Start here'}</strong></a><a class="next ${next?'':'disabled'}" href="${next?'#'+docSlug(next):'#'}"><small>Next →</small><strong>${next?esc(next):'End of section'}</strong></a></nav>`;
 document.querySelectorAll('[data-doc]').forEach(b=>b.addEventListener('click',()=>{const target=b.dataset.doc;docCurrent=target;history.pushState({doc:target},'',`/#${docSlug(target)}`);renderDocs();const browser=document.getElementById('docBrowser');if(browser)browser.open=false;window.scrollTo({top:0,behavior:'smooth'});}));
 content.querySelectorAll('.docPager a:not(.disabled)').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const target=decodeURIComponent(a.getAttribute('href').slice(1));const found=all.find(n=>docSlug(n)===target);if(found){docCurrent=found;history.pushState({doc:found},'',`/#${target}`);renderDocs();window.scrollTo({top:0,behavior:'smooth'});}}));
}
let docCurrent='Introduction';

window.addEventListener('popstate',renderDocs);window.addEventListener('hashchange',()=>{renderDocs();});renderDocs();</script></body></html>
